name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Universal7D2DModManager.slnx -c Release

      - name: Test
        run: dotnet test tests/U7D2D.Core.Tests/U7D2D.Core.Tests.csproj -c Release --no-build

      - name: Publish single file
        run: dotnet publish src/U7D2D.App/U7D2D.App.csproj -p:PublishProfile=SingleFile -c Release -p:DebugType=none

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Universal7D2DModManager-win-x64
          path: publish-single/Universal7D2DModManager.exe
          if-no-files-found: error
