<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal 7 Days to Die Mod Manager</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css?v=1.8.7" />
</head>
<body>
    <div id="app">
        <div class="boot-splash">
            <div class="boot-logo">U7D2D</div>
            <div class="boot-bar"><span></span></div>
        </div>
    </div>
    <div id="toast-host"></div>
    <!-- blazor.webview.js shows this block and wires .reload / .dismiss when the circuit dies.
         The text is bilingual and hard-coded on purpose: the localization service is gone with Blazor. -->
    <div id="blazor-error-ui">
        <div class="blazor-error-bar">
            <div class="blazor-error-text">
                <strong>Something went wrong / Щось пішло не так</strong>
                <span>Details are in Data/logs / Подробиці в Data/logs</span>
            </div>
            <div class="blazor-error-actions">
                <a href="#" class="reload">Reload / Перезавантажити</a>
                <a href="#" class="dismiss">Dismiss / Закрити</a>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webview.js"></script>
    <script src="js/app.js?v=1.8.7"></script>
</body>
</html>
